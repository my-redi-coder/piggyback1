<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>믿을맨 저금통</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --field:#2f7d3a; --field2:#2a7435; --ink:#2b2b2b; --muted:#6b6b6b; --card:#ffffff;
  --clay:#cf6b3d; --clay2:#e08a5a; --red:#ce0e2d;
  --skin:#f0c8a0; --skin2:#d9a97c; --outline:#7a0a1c; --gold:#ffffff;
  --btn:#ffffff; --btn-line:rgba(206,14,45,.4); --panel:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#1c4f27; --field2:#18461f;
  }
}
:root[data-theme="dark"]{
  --field:#1c4f27; --field2:#18461f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--field)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;color:var(--ink);
  background:repeating-linear-gradient(90deg,var(--field) 0 64px,var(--field2) 64px 128px);
  background-attachment:fixed;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px 28px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{
  margin:0;font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;
  font-size:30px;line-height:1.1;letter-spacing:.5px;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);
}
.sub{margin:6px 0 0;font-size:15px;color:#e4f4e4}
.icon-btn{
  flex:none;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--btn-line);background:var(--btn);color:var(--ink);
  font-size:20px;cursor:pointer;touch-action:manipulation;
}

/* 전광판 */
.board{
  margin-top:14px;padding:10px 16px;border-radius:14px;
  background:var(--red);color:#fff;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
}
.board .lab{display:block;font-size:13px;color:rgba(255,255,255,.85)}
.board .val{display:block;font-family:'Black Han Sans','Jua',sans-serif;font-variant-numeric:tabular-nums}
.board .big .val{font-size:26px;line-height:1.2}
.board .total{width:100%;padding-top:8px;border-top:1px dashed rgba(255,255,255,.5);display:flex;justify-content:center;align-items:baseline;gap:8px}
.board .total .val{font-family:'Jua',sans-serif;font-size:15px;color:#fff}

/* 무대 */
.stage{position:relative;width:100%;aspect-ratio:780/580;margin:14px auto 4px}
.stage img{width:100%;height:100%;display:block;border-radius:14px;user-select:none;-webkit-user-drag:none}

.item{position:absolute;left:50%;top:0;pointer-events:none;will-change:transform,opacity;z-index:3}
.face{display:block;background-repeat:no-repeat;background-position:center;background-size:contain;filter:drop-shadow(0 0 1px rgba(0,0,0,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.35))}

.item.c100{margin:-25px 0 0 -25px}
.item.c500{margin:-25px 0 0 -25px}
.item.b1000{margin:-26px 0 0 -26px}

.pop{
  position:absolute;pointer-events:none;z-index:4;text-align:center;white-space:nowrap;
  text-shadow:1px 0 #fff,-1px 0 #fff,0 1px #fff,0 -1px #fff,
              1px 1px #fff,-1px -1px #fff,1px -1px #fff,-1px 1px #fff;
}
.pop b{display:block;font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:26px;color:var(--red)}
.pop i{display:block;font-style:normal;font-size:15px;color:#7a0a1c}
.pop.paper b{font-size:22px;color:#7a0a1c;letter-spacing:1px}

.bubble{
  position:absolute;top:-4%;right:-5%;max-width:46%;z-index:5;
  padding:8px 12px;border-radius:14px;border:2.5px solid var(--btn-line);
  background:var(--card);color:var(--ink);font-size:15px;line-height:1.3;
  opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;
  transition:opacity .2s,transform .2s;pointer-events:none;
}
.bubble.show{opacity:1;transform:none}
.bubble::after{
  content:"";position:absolute;left:12px;bottom:-9px;width:14px;height:14px;
  background:var(--card);border-right:2.5px solid var(--btn-line);border-bottom:2.5px solid var(--btn-line);
  transform:rotate(45deg) skew(10deg,10deg);
}
.combo{
  position:absolute;left:-2%;top:26%;z-index:5;pointer-events:none;opacity:0;
  font-family:'Black Han Sans','Jua',sans-serif;font-size:22px;color:var(--red);
  text-shadow:1px 0 #fff,-1px 0 #fff,0 1px #fff,0 -1px #fff;transform:rotate(-8deg);
}

/* 버튼 */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.give{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:84px;padding:12px 6px;border-radius:16px;
  border:1px solid var(--btn-line);box-shadow:0 2px 0 rgba(0,0,0,.14);background:var(--btn);color:var(--ink);
  font-family:inherit;font-size:16px;cursor:pointer;touch-action:manipulation;
  transition:transform .08s;
}
.give:active{transform:translateY(2px) scale(.97)}
.give .face{transform:scale(1.1)}
.give:focus-visible,.icon-btn:focus-visible,.link-btn:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* 기록 */
details{margin-top:18px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--btn-line)}
summary{cursor:pointer;font-size:16px}
.count{margin:10px 0 4px;font-size:14px;color:var(--muted)}
#hist{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
#hist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--muted);font-size:15px}
#hist li b{font-weight:400;font-variant-numeric:tabular-nums}
#hist .empty{color:var(--muted);border:0}
.foot{margin:18px 0 0;font-size:13px;line-height:1.5;color:#e4f4e4;text-align:center}
.link-btn{margin-top:8px;background:none;border:0;color:#e4f4e4;font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
#note{display:none;margin-top:8px;color:#ffe27a}

</style>
</head>

<script>
(function(){
  'use strict';
  var KEY = 'kimmin-donation-v1';
  var storageOK = true;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(d && typeof d.total === 'number' && d.days && typeof d.days === 'object') return d;
      }
    }catch(e){ storageOK = false; }
    return {total:0, days:{}, count:0};
  }
  var state = load();
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ storageOK = false; showNote(); }
  }
  function showNote(){ if(!storageOK) document.getElementById('note').style.display = 'block'; }

  function pad(n){ return String(n).padStart(2,'0'); }
  function dayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function dayLabel(d){ d = d || new Date(); return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+'일월화수목금토'[d.getDay()]+')'; }
  function won(n){ return n.toLocaleString('ko-KR')+'원'; }

  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage'), todayEl = $('today'), totalEl = $('total');
  var comboEl = $('combo'), hist = $('hist');

  var currentKey = dayKey();
  var shownTotal = state.total;
  var shownToday = state.days[currentKey] || 0;

  function tween(el, to){
    var from = el._val || 0;
    cancelAnimationFrame(el._raf);
    var start = performance.now(), dur = reduce ? 0 : 380;
    function step(t){
      var p = dur ? Math.min(1,(t-start)/dur) : 1;
      var v = Math.round(from + (to-from)*(1-Math.pow(1-p,3)));
      el.textContent = won(v);
      el._val = v;
      if(p < 1) el._raf = requestAnimationFrame(step);
    }
    el._raf = requestAnimationFrame(step);
  }
  function renderHistory(){
    var keys = Object.keys(state.days).sort().reverse();
    hist.innerHTML = '';
    if(!keys.length){
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = '기록 없음'; hist.appendChild(e); return;
    }
    keys.forEach(function(k){
      var p = k.split('-');
      var li = document.createElement('li');
      var a = document.createElement('span'); a.textContent = p[0]+'.'+p[1]+'.'+p[2];
      var b = document.createElement('b'); b.textContent = won(state.days[k]);
      li.appendChild(a); li.appendChild(b); hist.appendChild(li);
    });
  }
  function initView(){
    todayEl.textContent = won(shownToday); todayEl._val = shownToday;
    totalEl.textContent = won(shownTotal); totalEl._val = shownTotal;
    renderHistory();
    showNote();
  }
  function syncDay(){
    var k = dayKey();
    if(k !== currentKey){
      currentKey = k;
      shownToday = state.days[k] || 0;
      tween(todayEl, shownToday);
    }
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncDay(); });

  /* 소리 */
  var ctx = null, muted = false;
  function ac(){
    if(!ctx){ var C = window.AudioContext || window.webkitAudioContext; if(C){ try{ ctx = new C(); }catch(e){} } }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function ping(c, t, f, dur, gain){
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function coinSound(kind){
    var c = ac(); if(!c || muted) return;
    var t = c.currentTime + 0.01, f = kind === 500 ? 1900 : 2300;
    ping(c, t, f, 0.5, 0.22);
    ping(c, t, f*2.41, 0.25, 0.10);
    ping(c, t, f*3.9, 0.12, 0.05);
  }
  function rustle(){
    var c = ac(); if(!c || muted) return;
    var t = c.currentTime + 0.01, dur = 0.11;
    var len = Math.floor(c.sampleRate * 0.3), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    var s = c.createBufferSource(); s.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(6500, t); bp.frequency.exponentialRampToValueAtTime(2200, t + dur);
    var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t + dur + 0.05);
  }
  function playSound(kind){ if(kind === 1000) rustle(); else coinSound(kind); }

  var ICON_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ce0e2d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ce0e2d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  $('mute').addEventListener('click', function(){
    muted = !muted;
    this.innerHTML = muted ? ICON_OFF : ICON_ON;
    this.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
    this.setAttribute('aria-pressed', String(muted));
  });

  /* 콤보 */
  function showCombo(n){
    comboEl.textContent = n < 6 ? '막아라 x'+n : n < 12 ? '막아라 막아라 x'+n+'!' : '막으라고!!!!!! x'+n;
    if(comboEl.animate){
      comboEl.animate([{opacity:0, transform:'rotate(-8deg) scale(.6)'},{opacity:1, transform:'rotate(-8deg) scale(1.15)', offset:.2},{opacity:1, transform:'rotate(-8deg) scale(1)', offset:.75},{opacity:0, transform:'rotate(-8deg) scale(1)'}], {duration:1300, fill:'forwards'});
    } else comboEl.style.opacity = 1;
  }

  /* 떨어지는 동전·지폐 */
  var G = {cw:780, ch:580, a:0.082, b:475.5, cy:231};
  function sc(){ return stage.clientWidth / G.cw; }
  function edgeX(Y){ var k = sc(); return (G.a * (Y / k) + G.b) * k; }
  function slotY(){ return sc() * G.cy; }
  function spawnPop(kind){
    var el = document.createElement('div');
    el.className = 'pop' + (kind === 1000 ? ' paper' : '');
    var b = document.createElement('b'), i = document.createElement('i');
    b.textContent = kind === 1000 ? '바스락…' : kind === 500 ? '돼그랑!!' : '돼그랑!';
    i.textContent = '+' + kind.toLocaleString('ko-KR') + '원';
    el.appendChild(b); el.appendChild(i);
    el.style.top = (slotY() - 10) + 'px';
    el.style.left = (edgeX(slotY()) + 14 + Math.random()*24) + 'px';
    stage.appendChild(el);
    if(!el.animate){ setTimeout(function(){ el.remove(); }, 900); return; }
    var a = el.animate([
      {transform:'translate(-50%,0) scale(.6)', opacity:0},
      {transform:'translate(-50%,-18px) scale(1.1)', opacity:1, offset:.2},
      {transform:'translate(-50%,-84px) scale(1)', opacity:0}
    ], {duration:1000, easing:'ease-out'});
    a.onfinish = function(){ el.remove(); };
  }
  function land(kind, quiet){
    var before = shownTotal;
    shownTotal += kind; shownToday += kind;
    tween(totalEl, shownTotal); tween(todayEl, shownToday);
    if(!quiet) playSound(kind);
    if(!quiet) spawnPop(kind);
    renderHistory();
    var pit = $('pitcher');
    if(pit.animate && !reduce){
      pit.animate([{transform:'translateY(0) scale(1,1)'},{transform:'translateY(2px) scale(1.006,.994)', offset:.3},{transform:'translateY(0) scale(1,1)'}], {duration:240, easing:'ease-out'});
    }
  }
  function fly(kind, btn){
    if(reduce || !stage.animate){ land(kind); return; }
    var sw = stage.clientWidth, s = sc();
    var isBill = kind === 1000;
    var W = (isBill ? 80 : kind === 500 ? 76 : 72) * s;
    var cy = slotY();
    var sx = 0, sy = -20;
    var face = btn && btn.querySelector ? btn.querySelector('.face') : null;
    if(face){
      var fr = face.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      sx = fr.left + fr.width/2 - (sr.left + sr.width/2);
      sy = fr.top + fr.height/2 - sr.top;
    } else { sx = Math.random()*60 - 30; }
    var el = document.createElement('div');
    el.className = 'item face ' + (isBill ? 'b1000' : 'c' + kind);
    el.style.width = W + 'px'; el.style.height = W + 'px';
    el.style.margin = (-W/2) + 'px 0 0 ' + (-W/2) + 'px';
    stage.appendChild(el);

    function polyFor(tx, ty, clipped){
      if(!clipped) return 'polygon(-200px 0px, ' + (W+200) + 'px 0px, ' + (W+200) + 'px ' + W + 'px, -200px ' + W + 'px)';
      var left = sw/2 + tx - W/2, top = ty - W/2;
      var e0 = edgeX(top) - left, e1 = edgeX(top + W) - left;
      return 'polygon(' + e0 + 'px 0px, ' + (W+200) + 'px 0px, ' + (W+200) + 'px ' + W + 'px, ' + e1 + 'px ' + W + 'px)';
    }
    var exC = edgeX(cy);
    function txFor(f){ return exC + W*(0.5 - f) - sw/2; }
    var dockTx = exC + G.a*W/2 + 3 + W/2 - sw/2;
    var halfTx = txFor(isBill ? 0.35 : 0.45);
    var fullTx = exC - W/2 - 4 - sw/2;
    var tm = isBill ? {fly:560, push:300, jam:520, inn:420} : {fly:430, push:240, jam:400, inn:220};
    var T = tm.fly + tm.push + tm.jam + tm.inn;
    var spin = isBill ? 0 : 720;
    function kf(t, tx, ty, ry, rot, scx, scy, clipped, ease){
      return {
        offset: t / T,
        transform: 'translate(' + tx + 'px,' + ty + 'px) perspective(300px) rotateY(' + ry + 'deg) rotate(' + rot + 'deg) scale(' + scx + ',' + scy + ')',
        clipPath: polyFor(tx, ty, clipped),
        easing: ease || 'linear'
      };
    }
    var j0 = tm.fly + tm.push, sq = isBill ? 0.93 : 1, sh = 2.5 * s / 0.52;
    var frames = [
      kf(0, sx, sy, 0, isBill ? -20 : 0, 1.1, 1.1, false, 'cubic-bezier(.25,.6,.45,1)'),
      kf(tm.fly, dockTx, cy, spin, 0, 1, 1, false, 'cubic-bezier(.4,0,.6,1)'),
      kf(j0, halfTx, cy, spin, 0, 1, isBill ? 0.96 : 1, true),
      kf(j0 + tm.jam*0.25, halfTx - sh, cy, spin, 0, 1, sq, true),
      kf(j0 + tm.jam*0.5, halfTx + sh*0.4, cy + 1, spin, 0, 1, sq, true),
      kf(j0 + tm.jam*0.75, halfTx - sh*0.8, cy, spin, 0, 1, sq, true),
      kf(j0 + tm.jam, halfTx, cy, spin, 0, 1, sq, true, 'cubic-bezier(.5,0,.8,.6)'),
      kf(T, fullTx, cy, spin, 0, 1, sq, true)
    ];
    var a = el.animate(frames, {duration: T});
    setTimeout(function(){ playSound(kind); spawnPop(kind); }, j0);
    a.onfinish = function(){ el.remove(); land(kind, true); };
  }

  var combo = 0, lastTap = 0, lastKind = 0;
  function tap(kind, btn){
    syncDay();
    var now = performance.now();
    if(kind === 100 && lastKind === 100 && now - lastTap < 700) combo++; else combo = 1;
    lastTap = now; lastKind = kind;
    if(kind === 100 && combo >= 3) showCombo(combo);
    var k = dayKey();
    state.total += kind;
    state.count = (state.count || 0) + 1;
    state.days[k] = (state.days[k] || 0) + kind;
    save();
    ac();
    fly(kind, btn);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.give'), function(btn){
    btn.addEventListener('click', function(){ tap(parseInt(btn.getAttribute('data-amt'), 10), btn); });
  });

  /* 초기화 */
  var armed = false, armT, resetBtn = $('reset');
  resetBtn.addEventListener('click', function(){
    if(!armed){
      armed = true;
      resetBtn.textContent = '한번 더 누르면 삭제';
      armT = setTimeout(function(){ armed = false; resetBtn.textContent = '기록 지우기'; }, 3500);
    } else {
      clearTimeout(armT); armed = false;
      state = {total:0, days:{}, count:0};
      save();
      shownTotal = 0; shownToday = 0;
      tween(totalEl, 0); tween(todayEl, 0);
renderHistory();
      resetBtn.textContent = '기록 지우기';
    }
  });

  initView();
})();
</script>
</body>
</html>
